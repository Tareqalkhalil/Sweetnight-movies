services:
  - type: web
    name: sweet-night
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start -- --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXTAUTH_URL
        value: https://your-render-app.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
  - type: psql
    name: sweet-night-db
    plan: free
